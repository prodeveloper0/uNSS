# uNSS server behind Traefik.
#
# Alternative to docker-compose.yaml for setups that already run Traefik as
# reverse proxy. The container publishes no port of its own — Traefik reaches
# it inside the docker network and terminates TLS on 443.
#
# Requires an external docker network named `traefik`, and one variable:
#
#   UNSS_BASICAUTH_USERS   htpasswd line, e.g.  switch:$2y$05$...
#                          created with:  htpasswd -nbB switch '<password>'
#
# Keep that value out of this file. Supply it from a secret store (OpenMedia-
# Vault users can have locket pull it from OpenBao) or, failing that, from an
# .env file that is not committed.
#
# Why basicAuth and not a proper login: the Switch client does not follow
# redirects, so any redirect-based flow (authelia, OIDC) can never complete.
# libcurl does however send credentials taken straight from the URL, which
# means https://user:pass@host works without touching the client at all.
#
# The router rule is not set here on purpose: it comes from Traefik's
# defaultRule, which derives the host name from the compose service name.
# Renaming the service therefore changes the URL.

services:
  unss:
    image: ghcr.io/dmuix/unss-server:latest
    container_name: unss
    environment:
      TZ: ${TZ}
    volumes:
      - ./savedata:/app/savedata
      # Must already exist as a FILE. If it does not, docker creates a
      # directory with that name and the server fails to start.
      - ./metadata.sqlite:/app/metadata.sqlite
    restart: unless-stopped
    networks:
      traefik:
    labels:
      traefik.enable: "true"
      # The image exposes no port — without this label Traefik builds no
      # router at all and answers 404.
      traefik.http.services.unss.loadbalancer.server.port: "8989"
      # Defined here rather than in Traefik's dynamic config so the hash can
      # come from a variable instead of sitting in a file in plain text.
      # Compose interpolates the value once; the `$` inside a bcrypt hash is
      # therefore NOT doubled here (that is only needed for literal hashes).
      traefik.http.middlewares.unss-auth.basicauth.users: "${UNSS_BASICAUTH_USERS}"
      traefik.http.routers.unss.middlewares: "unss-auth"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8989/users/healthcheck/saves')\" || exit 1"]
      interval: "30s"
      timeout: "5s"
      retries: 3
      start_period: "10s"

networks:
  traefik:
    external: true
