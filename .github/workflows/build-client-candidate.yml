name: Build Switch client candidate

on:
  push:
    branches:
      - fix/save-revision-change-detection
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Build devkitA64 image
        run: docker build -t unss-client-builder:latest client

      - name: Build sysmodule and client
        run: ./build-all.sh

      - name: Verify embedded sysmodule
        run: |
          test -f client-sysmodule/client-sysmodule.nsp
          test -f client/romfs/exefs.nsp
          test -f client/client.nro
          test "$(sha256sum client-sysmodule/client-sysmodule.nsp | cut -d' ' -f1)" = "$(sha256sum client/romfs/exefs.nsp | cut -d' ' -f1)"
          sha256sum client-sysmodule/client-sysmodule.nsp client/romfs/exefs.nsp client/client.nro | tee build-sha256.txt

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: unss-save-revision-candidate
          path: |
            client/client.nro
            client-sysmodule/client-sysmodule.nsp
            client/romfs/exefs.nsp
            build-sha256.txt
          if-no-files-found: error
